<style>
  :root {
    --bg: #0f1419;

    --text: #e2e8f0;
    --muted: #94a3b8;
    --success: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px;
    line-height: 1.5;
  }
  .container { max-width: 680px; margin: 0 auto; }
  h1 { text-align: center; font-size: 1.6rem; margin: 12px 0 8px; font-weight: 600; }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .search-box { position: relative; margin-bottom: 20px; }
  input[type="text"] {

    border: none; border-radius: 12px; background: var(--card); color: var(--text);

  }
  input:focus { box-shadow: 0 0 0 2px var(--accent); }
  .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1.2rem; }
  .results { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; }
  .card-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; }
  .meta { display: flex; flex-direction: column; gap: 6px; font-size: 0.95rem; color: var(--muted); }
  .meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .meta-label { min-width: 42px; font-weight: 500; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { background: var(--accent); color: white; padding: 2px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }
  .key-badge { background: var(--success); }
  .no-result { text-align: center; color: var(--muted); padding: 40px 20px; }
  .count { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 12px; }
</style>
</head>

const searchInput = document.getElementById('search');
const resultsDiv = document.getElementById('results');
const countDiv = document.getElementById('count');

function normalize(str) {
  return (str || '').toLowerCase().replace(/\s+/g, '');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#39;'
  }[m]));
}

function renderBadges(items, className = 'badge') {
  if (!items || items.length === 0) return '<span style="color:#64748b">—</span>';
  return `<div class="badges">${items.map(v => `<strong class="${className}">${escapeHtml(v)}</strong>`).join('')}</div>`;
}

function search(query) {
  if (!query.trim()) {
    resultsDiv.innerHTML = '';
    countDiv.textContent = `共 ${songs.length} 首歌`;
    return;
  }
  
  const q = normalize(query);
  const matches = songs.filter(s => normalize(s.title).includes(q));
  
  if (matches.length === 0) {
    resultsDiv.innerHTML = '<div class="no-result">搵唔到相關歌曲</div>';
    countDiv.textContent = '';
    return;
  }
  
  matches.sort((a, b) => {
    const aExact = normalize(a.title) === q;
    const bExact = normalize(b.title) === q;
    if (aExact && !bExact) return -1;
    if (!aExact && bExact) return 1;
    return a.title.length - b.title.length;
  });
  
  resultsDiv.innerHTML = matches.slice(0, 30).map(s => `
    <div class="card">
      <div class="card-title">${escapeHtml(s.title)}</div>
      <div class="meta">
        <div class="meta-row">
          <span class="meta-label">筆劃</span>
          <strong class="badge">${escapeHtml(s.sheet)}</strong>
        </div>
        <div class="meta-row">
          <span class="meta-label">位置</span>
          ${renderBadges(s.positions)}
        </div>
        <div class="meta-row">
          <span class="meta-label">Key</span>
          ${renderBadges(s.keys, 'badge key-badge')}
        </div>
      </div>
    </div>
  `).join('');
  
  countDiv.textContent = `搵到 ${matches.length} 首${matches.length > 30 ? '（只顯示前 30 首）' : ''}`;
}

searchInput.addEventListener('input', (e) => search(e.target.value));
search('');
</script>
